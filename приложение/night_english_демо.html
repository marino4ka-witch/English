<style>
  :root{
    --bg:#0b0a0d; --panel:#1a1512; --panel2:#221a15; --line:#2c2318;
    --gold:#c9a24b; --gold2:#e8c877; --goldsoft:#8f7333; --goldln:rgba(230,199,119,.5);
    --parch:#ece2cf; --muted:#9b8f7c;
    --cardtop:#6d1c22; --cardbot:#390f13; --cardln:#a9702f;
    --red:#b5544d; --redbg1:#7d2622; --redbg2:#531a17; --redtx:#f0cdc7;
    --amber:#d9a84a; --ambbg1:#a2762c; --ambbg2:#6f5017; --ambtx:#f3e0b0;
    --green:#4f9d6b; --grnbg1:#2f6048; --grnbg2:#1a3a2b; --grntx:#c4e8d2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--parch);
    background:radial-gradient(130% 80% at 50% -8%, #1c1512 0%, #0d0a0b 48%, #050405 100%),#050405;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ember{position:fixed;bottom:-16px;width:3px;height:3px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px 2px rgba(201,162,75,.6);opacity:0;
    animation:rise linear infinite;pointer-events:none;z-index:0}
  @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.7}100%{transform:translateY(-104vh) scale(1);opacity:0}}
  @media (prefers-reduced-motion: reduce){.ember{display:none}}
  .spark2{position:fixed;pointer-events:none;z-index:60;opacity:1;line-height:1;
    transition:transform .62s cubic-bezier(.2,.7,.3,1),opacity .55s ease}
  .card.fly-know{animation:flyR .45s ease forwards}
  .card.fly-dont{animation:flyL .45s ease forwards}
  .card.fly-repeat{animation:flyU .45s ease forwards}
  @keyframes flyR{to{transform:translateX(75%) rotate(9deg);opacity:0}}
  @keyframes flyL{to{transform:translateX(-75%) rotate(-9deg);opacity:0}}
  @keyframes flyU{to{transform:translateY(-48%) scale(.8);opacity:0}}

  .phone{position:relative;z-index:1;display:flex;flex-direction:column;
    width:min(100vw, calc(100vh * 9 / 16));height:min(100vh, calc(100vw * 16 / 9));
    background:linear-gradient(180deg,#141010 0%,#0b0809 100%);
    border:1px solid #241d17;border-radius:28px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(201,162,75,.12),0 0 70px rgba(0,0,0,.75),inset 0 0 90px rgba(0,0,0,.55)}

  /* ── шапка ── */
  .top{display:flex;align-items:center;gap:11px;padding:14px 16px 10px;flex:0 0 auto}
  .top .compass{width:38px;height:38px;flex:0 0 auto}
  .brand{flex:1 1 auto;line-height:1}
  .brand .n{font-size:17px;letter-spacing:3px}
  .brand .n b{color:var(--gold2);font-weight:700}.brand .n i{color:var(--parch);font-style:normal;font-weight:700}
  .brand .s{font-size:9px;letter-spacing:3px;color:var(--goldsoft);text-transform:uppercase;
    margin-top:3px;font-family:system-ui,sans-serif}
  .iconbtn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--goldsoft);
    background:radial-gradient(circle at 50% 35%,#241c14,#140f0b);color:var(--gold2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:15px}
  .iconbtn:hover{border-color:var(--gold2);box-shadow:0 0 10px rgba(201,162,75,.3)}
  .hr{height:1px;margin:0 16px;flex:0 0 auto;
    background:linear-gradient(90deg,transparent,var(--goldln),transparent)}

  /* ── строка заголовка ── */
  .head{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 18px 4px;flex:0 0 auto}
  .head .ht{font-size:24px;color:var(--parch);letter-spacing:.5px}
  .head .hsub{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif;margin-top:2px}
  .head .hpos{font-size:14px;color:var(--muted);font-family:system-ui,sans-serif}
  .head .hpos b{color:var(--gold2);font-weight:700}
  .levelbar{display:flex;gap:6px;padding:8px 16px 2px;flex:0 0 auto}
  .levelbar button{flex:1;font-family:system-ui,sans-serif;font-size:10.5px;padding:8px 2px;border-radius:9px;
    cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,#1b1510,#120d0a);color:var(--muted)}
  .levelbar button.on{background:linear-gradient(180deg,#3a2c1c,#2a2015);border-color:var(--gold);color:var(--gold2);
    box-shadow:0 0 8px rgba(201,162,75,.25)}
  .cardlvl{position:absolute;top:11px;left:50%;transform:translateX(-50%);font-family:system-ui,sans-serif;
    font-size:10px;letter-spacing:1px;color:var(--gold2);border:1px solid var(--goldsoft);border-radius:10px;
    padding:1px 9px;z-index:3;background:rgba(0,0,0,.3)}
  .deckbar{display:flex;gap:5px;padding:6px 16px 0;flex:0 0 auto}
  .dk{flex:1;font-family:system-ui,sans-serif;font-size:11px;padding:8px 3px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:linear-gradient(180deg,#1b1510,#120d0a);color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
  .dk b{font-weight:700;font-size:12px}
  .dk.gen{flex:1.5;color:var(--gold2)} .dk.sh{flex:.55}
  .dk.d{color:var(--redtx)} .dk.r{color:var(--ambtx)} .dk.k{color:var(--grntx)}
  .dk.on{box-shadow:inset 0 0 0 1px var(--gold);background:linear-gradient(180deg,#2a2015,#1a140d)}
  .pbtn .pt b{font-size:13px;color:#fff;opacity:.95}

  .screen{flex:1 1 auto;overflow-y:auto;padding:10px 16px 8px;display:flex;flex-direction:column}
  .dsep{color:var(--goldsoft);font-size:12px;align-self:center;padding:0 2px}

  /* ── карта ── */
  .card{position:relative;flex:1 1 auto;min-height:210px;border-radius:16px;cursor:pointer;user-select:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 22px;
    background:radial-gradient(115% 85% at 50% 40%, #6a1a20 0%, #481116 50%, #2c0a0e 100%);
    border:1px solid var(--cardln);
    box-shadow:inset 0 0 0 1px rgba(230,199,119,.55),inset 0 0 60px rgba(0,0,0,.55),0 8px 26px rgba(0,0,0,.5)}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.20;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g fill='none' stroke='%23d8b878' stroke-width='0.8'><circle cx='100' cy='100' r='96'/><circle cx='100' cy='100' r='80'/><circle cx='100' cy='100' r='60'/></g><g stroke='%23d8b878' stroke-width='0.7'><line x1='180.0' y1='100.0' x2='196.0' y2='100.0'/><line x1='179.7' y1='107.0' x2='189.7' y2='107.8'/><line x1='178.8' y1='113.9' x2='194.5' y2='116.7'/><line x1='177.3' y1='120.7' x2='186.9' y2='123.3'/><line x1='175.2' y1='127.4' x2='190.2' y2='132.8'/><line x1='172.5' y1='133.8' x2='181.6' y2='138.0'/><line x1='169.3' y1='140.0' x2='183.1' y2='148.0'/><line x1='165.5' y1='145.9' x2='173.7' y2='151.6'/><line x1='161.3' y1='151.4' x2='173.5' y2='161.7'/><line x1='156.6' y1='156.6' x2='163.6' y2='163.6'/><line x1='151.4' y1='161.3' x2='161.7' y2='173.5'/><line x1='145.9' y1='165.5' x2='151.6' y2='173.7'/><line x1='140.0' y1='169.3' x2='148.0' y2='183.1'/><line x1='133.8' y1='172.5' x2='138.0' y2='181.6'/><line x1='127.4' y1='175.2' x2='132.8' y2='190.2'/><line x1='120.7' y1='177.3' x2='123.3' y2='186.9'/><line x1='113.9' y1='178.8' x2='116.7' y2='194.5'/><line x1='107.0' y1='179.7' x2='107.8' y2='189.7'/><line x1='100.0' y1='180.0' x2='100.0' y2='196.0'/><line x1='93.0' y1='179.7' x2='92.2' y2='189.7'/><line x1='86.1' y1='178.8' x2='83.3' y2='194.5'/><line x1='79.3' y1='177.3' x2='76.7' y2='186.9'/><line x1='72.6' y1='175.2' x2='67.2' y2='190.2'/><line x1='66.2' y1='172.5' x2='62.0' y2='181.6'/><line x1='60.0' y1='169.3' x2='52.0' y2='183.1'/><line x1='54.1' y1='165.5' x2='48.4' y2='173.7'/><line x1='48.6' y1='161.3' x2='38.3' y2='173.5'/><line x1='43.4' y1='156.6' x2='36.4' y2='163.6'/><line x1='38.7' y1='151.4' x2='26.5' y2='161.7'/><line x1='34.5' y1='145.9' x2='26.3' y2='151.6'/><line x1='30.7' y1='140.0' x2='16.9' y2='148.0'/><line x1='27.5' y1='133.8' x2='18.4' y2='138.0'/><line x1='24.8' y1='127.4' x2='9.8' y2='132.8'/><line x1='22.7' y1='120.7' x2='13.1' y2='123.3'/><line x1='21.2' y1='113.9' x2='5.5' y2='116.7'/><line x1='20.3' y1='107.0' x2='10.3' y2='107.8'/><line x1='20.0' y1='100.0' x2='4.0' y2='100.0'/><line x1='20.3' y1='93.0' x2='10.3' y2='92.2'/><line x1='21.2' y1='86.1' x2='5.5' y2='83.3'/><line x1='22.7' y1='79.3' x2='13.1' y2='76.7'/><line x1='24.8' y1='72.6' x2='9.8' y2='67.2'/><line x1='27.5' y1='66.2' x2='18.4' y2='62.0'/><line x1='30.7' y1='60.0' x2='16.9' y2='52.0'/><line x1='34.5' y1='54.1' x2='26.3' y2='48.4'/><line x1='38.7' y1='48.6' x2='26.5' y2='38.3'/><line x1='43.4' y1='43.4' x2='36.4' y2='36.4'/><line x1='48.6' y1='38.7' x2='38.3' y2='26.5'/><line x1='54.1' y1='34.5' x2='48.4' y2='26.3'/><line x1='60.0' y1='30.7' x2='52.0' y2='16.9'/><line x1='66.2' y1='27.5' x2='62.0' y2='18.4'/><line x1='72.6' y1='24.8' x2='67.2' y2='9.8'/><line x1='79.3' y1='22.7' x2='76.7' y2='13.1'/><line x1='86.1' y1='21.2' x2='83.3' y2='5.5'/><line x1='93.0' y1='20.3' x2='92.2' y2='10.3'/><line x1='100.0' y1='20.0' x2='100.0' y2='4.0'/><line x1='107.0' y1='20.3' x2='107.8' y2='10.3'/><line x1='113.9' y1='21.2' x2='116.7' y2='5.5'/><line x1='120.7' y1='22.7' x2='123.3' y2='13.1'/><line x1='127.4' y1='24.8' x2='132.8' y2='9.8'/><line x1='133.8' y1='27.5' x2='138.0' y2='18.4'/><line x1='140.0' y1='30.7' x2='148.0' y2='16.9'/><line x1='145.9' y1='34.5' x2='151.6' y2='26.3'/><line x1='151.4' y1='38.7' x2='161.7' y2='26.5'/><line x1='156.6' y1='43.4' x2='163.6' y2='36.4'/><line x1='161.3' y1='48.6' x2='173.5' y2='38.3'/><line x1='165.5' y1='54.1' x2='173.7' y2='48.4'/><line x1='169.3' y1='60.0' x2='183.1' y2='52.0'/><line x1='172.5' y1='66.2' x2='181.6' y2='62.0'/><line x1='175.2' y1='72.6' x2='190.2' y2='67.2'/><line x1='177.3' y1='79.3' x2='186.9' y2='76.7'/><line x1='178.8' y1='86.1' x2='194.5' y2='83.3'/><line x1='179.7' y1='93.0' x2='189.7' y2='92.2'/></g><g fill='%23d8b878' fill-opacity='0.9'><path d='M174.0 100.0 L100.0 107.0 L100 100 L100.0 93.0 Z'/><path d='M100.0 174.0 L93.0 100.0 L100 100 L107.0 100.0 Z'/><path d='M26.0 100.0 L100.0 93.0 L100 100 L100.0 107.0 Z'/><path d='M100.0 26.0 L107.0 100.0 L100 100 L93.0 100.0 Z'/><path d='M136.8 136.8 L96.5 103.5 L100 100 L103.5 96.5 Z'/><path d='M63.2 136.8 L96.5 96.5 L100 100 L103.5 103.5 Z'/><path d='M63.2 63.2 L103.5 96.5 L100 100 L96.5 103.5 Z'/><path d='M136.8 63.2 L103.5 103.5 L100 100 L96.5 96.5 Z'/></g><circle cx='100' cy='100' r='4' fill='%23d8b878'/></svg>");background-repeat:no-repeat;background-position:center 46%;background-size:82% auto}
  .card::after{content:"";position:absolute;inset:9px;border:1px solid rgba(230,199,119,.4);border-radius:11px;pointer-events:none}
  .card.pk{box-shadow:inset 0 0 0 1px var(--green),inset 0 0 60px rgba(0,0,0,.55),0 0 20px rgba(79,157,107,.35)}
  .card.pd{box-shadow:inset 0 0 0 1px var(--red),inset 0 0 60px rgba(0,0,0,.55),0 0 20px rgba(181,84,77,.35)}
  .card.pr{box-shadow:inset 0 0 0 1px var(--amber),inset 0 0 60px rgba(0,0,0,.55),0 0 20px rgba(217,168,74,.35)}
  .cnr{position:absolute;width:22px;height:22px;font-size:0;opacity:.75;z-index:2;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><g fill='none' stroke='%23d8b878' stroke-width='1.3' stroke-linecap='round'><path d='M3 14 Q3 3 14 3'/><path d='M7 14 Q7 7 14 7'/><path d='M3 3 h5 M3 3 v5'/></g><circle cx='5' cy='5' r='1.4' fill='%23d8b878'/></svg>") no-repeat center/contain}
  .cnr.tl{top:12px;left:14px}
  .cnr.tr{top:12px;right:14px;transform:rotate(90deg)}
  .cnr.br{bottom:12px;right:14px;transform:rotate(180deg)}
  .cnr.bl{bottom:12px;left:14px;transform:rotate(270deg)}
  .ctop{position:relative;z-index:2;margin-bottom:8px}.ctop svg{width:22px;height:22px;opacity:.9}
  .word{position:relative;z-index:2;font-size:32px;font-weight:700;color:var(--gold2);line-height:1.15;
    text-shadow:0 1px 12px rgba(0,0,0,.6)}
  #rev{position:relative;z-index:2}
  .rule{width:120px;height:1px;margin:14px auto;position:relative;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .rule::after{content:"◆";position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:9px}
  .tr{font-size:23px;color:#f0dca8;font-style:normal;letter-spacing:.4px;font-family:"Iowan Old Style",Georgia,serif}
  .bk{font-size:21px;color:var(--parch);margin-top:5px}
  .hint{position:relative;z-index:2;font-size:11px;color:#e0bd93;opacity:.7;margin-top:14px;font-family:system-ui,sans-serif}
  .cmoon{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);color:var(--gold2);font-size:14px;z-index:2;opacity:.85}

  /* ── пилюли озвучки ── */
  .say{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:12px;flex:0 0 auto}
  .sbtn{font-family:system-ui,sans-serif;font-size:13px;padding:9px 22px;border-radius:22px;cursor:pointer;
    background:linear-gradient(180deg,#211913,#140f0b);border:1px solid var(--goldsoft);color:var(--gold2);
    display:flex;align-items:center;gap:6px}
  .sbtn:hover{border-color:var(--gold2);box-shadow:0 0 12px rgba(201,162,75,.3)}
  .sbtn:active{transform:scale(.96)}

  /* ── навигация ── */
  .nav{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:9px;flex:0 0 auto}
  .nav .btn{flex:1;max-width:170px;font-family:system-ui,sans-serif;font-size:13px;padding:11px;border-radius:11px;
    border:1px solid var(--line);background:linear-gradient(180deg,#1b1510,#120d0a);color:var(--parch);cursor:pointer}
  .nav .btn:hover{border-color:var(--gold)}

  /* ── три плитки статуса ── */
  .row3{display:flex;gap:9px;margin-top:11px;flex:0 0 auto}
  .pbtn{flex:1;border-radius:13px;cursor:pointer;padding:12px 4px 11px;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-family:system-ui,sans-serif;border:1px solid;position:relative;overflow:hidden}
  .pbtn .pi{font-size:19px;line-height:1}.pbtn .pt{font-size:12.5px}
  .pbtn::after{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;
    background:radial-gradient(circle at 50% 120%, currentColor, transparent 60%)}
  .pbtn:active{transform:translateY(1px)}
  .pbtn.dont{background:linear-gradient(180deg,var(--redbg1),var(--redbg2));border-color:var(--red);color:var(--redtx)}
  .pbtn.rep{background:linear-gradient(180deg,var(--ambbg1),var(--ambbg2));border-color:var(--amber);color:var(--ambtx)}
  .pbtn.know{background:linear-gradient(180deg,var(--grnbg1),var(--grnbg2));border-color:var(--green);color:var(--grntx)}
  .pbtn:hover{filter:brightness(1.08)}

  /* общие кнопки/списки */
  .row{display:flex;gap:11px;margin-top:14px;flex:0 0 auto}
  .row .btn{flex:1;font-family:system-ui,sans-serif;font-size:14px;padding:13px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);color:var(--parch);cursor:pointer}
  .row .btn:hover{border-color:var(--gold)}

  /* викторина */
  .q{font-size:13px;color:var(--muted);font-family:system-ui,sans-serif;margin:2px 0 4px}
  .qword{font-size:24px;color:var(--gold2);text-align:center;margin:6px 0 4px;transition:filter .25s ease,opacity .25s ease}
  .qcover{position:relative;cursor:pointer;margin:4px 0 2px;min-height:46px;display:flex;align-items:center;justify-content:center}
  .qword.blur{filter:blur(11px);opacity:.5;user-select:none}
  .qveil{position:absolute;font-size:12px;color:var(--gold2);font-family:system-ui,sans-serif;
    background:rgba(11,10,13,.5);padding:5px 12px;border-radius:12px;pointer-events:none;border:1px solid var(--goldsoft)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:7px 0;padding:13px 14px;
    border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--parch);cursor:pointer;
    font-size:15px;font-family:system-ui,sans-serif}
  .opt:hover{border-color:var(--gold)}
  .opt .lt{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--goldsoft);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:12px}
  .opt.correct{background:var(--grnbg2);border-color:var(--green)}.opt.correct .lt{background:var(--green);color:#0c0a09}
  .opt.wrong{background:var(--redbg2);border-color:var(--red)}.opt.wrong .lt{background:var(--red);color:#0c0a09}
  .qmode{display:flex;gap:10px;margin-bottom:8px;flex:0 0 auto}
  .qm{flex:1;padding:11px;border-radius:11px;font-family:system-ui,sans-serif;font-size:13px;cursor:pointer;
    border:1px solid var(--line);background:linear-gradient(180deg,#1b1510,#120d0a);color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:6px}
  .qm.on{background:linear-gradient(180deg,var(--redbg1),var(--redbg2));border-color:var(--red);color:var(--redtx)}
  .card.qcard{flex:0 0 auto;min-height:150px;padding:22px 20px}
  .qsub{position:relative;z-index:2;font-size:12px;color:#e0bd93;opacity:.85;font-family:system-ui,sans-serif;
    margin-top:10px;line-height:1.5;text-align:center}
  .qreveal{width:100%;margin-top:9px;padding:12px;border-radius:11px;cursor:pointer;font-family:system-ui,sans-serif;
    font-size:14px;color:var(--parch);background:linear-gradient(180deg,#1b1510,#120d0a);border:1px solid var(--goldsoft);
    display:flex;align-items:center;justify-content:center;gap:6px}
  .qreveal:hover{border-color:var(--gold)}
  .qopts{margin-top:12px}

  /* печать */
  input[type=text]{width:100%;padding:14px;font-size:17px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--parch);margin-top:12px;font-family:system-ui,sans-serif}
  input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 12px rgba(201,162,75,.3)}
  .tip{margin-top:12px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);
    color:var(--muted);font-size:12px;font-family:system-ui,sans-serif;line-height:1.5}.tip b{color:var(--gold)}
  .msg{text-align:center;margin-top:12px;font-size:15px;min-height:22px;font-family:system-ui,sans-serif}

  else if(deck==='__repeat__')cards=base.filter(c=>c.pile==='repeat');

  if(!cards.length){cards=base.length?base:all;deck='__all__';}reindex();idx=0;}

  variants.push(norm(ans.replace(/\([^)]*\)/g,'')));
  const ok=variants.some(v=>v===val);cards[order[idx]].pile=ok?'know':'dont';
  document.getElementById('msg').textContent=ok?'✓ Верно!':'✕ Правильно: '+ans;

function loadCsv(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const rows=rd.result.split(/\r?\n/).filter(r=>r.trim());const parsed=[];
    for(let i=0;i<rows.length;i++){if(rows[i].trim().startsWith('#'))continue;const p=rows[i].split(',');if(p.length<3)continue;
      if(i===0&&/english|русск|engli/i.test(rows[i]))continue;
      parsed.push({en:p[0].trim(),tr:p[1].trim(),ru:p.slice(2).join(',').trim(),theme:'Мой CSV',pile:null});}
    if(parsed.length){all=parsed;deck='__all__';applyDeck();setTab('flip');}else alert('Формат: English,Transcription,Русский');};
  rd.readAsText(f,'utf-8');}

document.getElementById('screen').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(!a)return;
  if(a==='flip')flip();
  else if(a==='mark')mark(el.dataset.p);
  else if(a==='opt')answer(el.closest('.opt'),el.closest('.opt').dataset.ok==='1');
  else if(a==='check')checkType();
  else if(a==='restart')restart();
  else if(a==='shuffle')shuffleCards();
  else if(a==='dir')setDir(el.dataset.d);
  else if(a==='lvl'){lvl=el.dataset.l;deck='__all__';applyDeck();setTab('flip');}
  else if(a==='prev')prev();
  else if(a==='next')next();
  else if(a==='say'){if(idx<order.length)speak(cards[order[idx]].en,el.dataset.acc);}
  else if(a==='voicetest')speak('to go home','US');
  else if(a==='qmode'){quizMode=el.dataset.m;quizShown=false;render();}
  else if(a==='qreveal'){quizShown=true;render();}
  else if(a==='learnpile')learnPile(el.dataset.p);
});
function renderLevelbar(){const lb=document.getElementById('levelbar');
  const show=(tab==='flip'||tab==='quiz'||tab==='type');lb.style.display=show?'flex':'none';if(!show)return;
  const opts=[['__all__','Все'],['A1','A1'],['A2','A2'],['B1','B1'],['B2','B2'],['Фразы','Фразы'],['Омофоны','Омоф.']];
  lb.innerHTML=opts.map(([v,t])=>`<button class="${lvl===v?'on':''}" data-act="lvl" data-l="${v}">${t}</button>`).join('');}
function levelBase(){return lvl==='__all__'?all:all.filter(c=>c.lvl===lvl);}
function renderDeckbar(){const db=document.getElementById('deckbar');
  const show=(tab==='flip'||tab==='quiz'||tab==='type');db.style.display=show?'flex':'none';if(!show)return;
  const b=levelBase();const tot=b.length,k=b.filter(c=>c.pile==='know').length,d=b.filter(c=>c.pile==='dont').length,r=b.filter(c=>c.pile==='repeat').length;
  db.innerHTML=`
    <button class="dk gen ${deck==='__all__'?'on':''}" data-act="opendeck">🂠 Общая <b>${tot}</b></button>
    <button class="dk sh" data-act="shuffledeck" title="Перемешать">🔀</button>
    <button class="dk d ${deck==='__dont__'?'on':''}" data-act="learnpile" data-p="dont">✗ <b>${d}</b></button>
    <button class="dk r ${deck==='__repeat__'?'on':''}" data-act="learnpile" data-p="repeat">↻ <b>${r}</b></button>
    <button class="dk k ${deck==='__know__'?'on':''}" data-act="learnpile" data-p="know">✓ <b>${k}</b></button>`;}
document.getElementById('levelbar').addEventListener('click',e=>{
  const el=e.target.closest('[data-act=lvl]');if(!el)return;
  lvl=el.dataset.l;deck='__all__';applyDeck();render();});
// ── память: сохраняем прогресс (вкладка, карточка, уровень, колоды) ──
const STORE='nightEnglish_v1';
function save(){try{const piles={};all.forEach(c=>{if(c.pile)piles[c.en]=c.pile;});
  localStorage.setItem(STORE,JSON.stringify({tab,lvl,dir,quizMode,idx,order,voice:chosenVoiceName,piles}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(!s)return false;
  if(s.piles)all.forEach(c=>{if(s.piles[c.en])c.pile=s.piles[c.en];});
  if(s.lvl)lvl=s.lvl;if(s.dir)dir=s.dir;
  if(s.quizMode)quizMode=s.quizMode;if(s.voice)chosenVoiceName=s.voice;if(s.tab)tab=s.tab;
  applyDeck();
  if(Array.isArray(s.order)&&s.order.length===order.length)order=s.order;
  if(typeof s.idx==='number')idx=Math.min(Math.max(s.idx,0),order.length);
  return true;}catch(e){return false;}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.getElementById('btnSpark').addEventListener('click',()=>{setTab('flip');shuffleCards();});
document.getElementById('btnMenu').addEventListener('click',()=>setTab('settings'));

if(!load())applyDeck();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
render();
</script>
