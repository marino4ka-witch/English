<style>
  :root{
    --bg:#0c0a09; --screen:#141110; --panel:#1c1815; --panel2:#231d19;
    --gold:#c9a24b; --gold2:#e6c777; --goldsoft:#a98b3f;
    --wine:#5a181c; --wine2:#7a2328; --wineln:#8c5a3a;
    --green:#4f9d6b; --greenbg:#16281d; --red:#a34a45; --redbg:#2a1614;
    --parch:#ece2cf; --muted:#9b8f7c; --line:#2f2721;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--parch);
    background:
      radial-gradient(120% 70% at 50% -5%, #241a12 0%, #120d0a 45%, #060504 100%),
      #060504;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ember{position:fixed;bottom:-16px;width:3px;height:3px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px 2px rgba(201,162,75,.7);opacity:0;
    animation:rise linear infinite;pointer-events:none;z-index:0}
  @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}
    15%{opacity:.8}100%{transform:translateY(-104vh) scale(1);opacity:0}}

  /* телефон 9:16 */
  .phone{position:relative;z-index:1;display:flex;flex-direction:column;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    background:linear-gradient(180deg,#151110 0%,#0f0c0a 100%);
    border:1px solid #241d17;border-radius:26px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(201,162,75,.12),0 0 70px rgba(0,0,0,.7),
      inset 0 0 90px rgba(0,0,0,.55)}

  .status{display:flex;justify-content:space-between;align-items:center;
    padding:9px 18px 3px;font-size:12px;color:var(--muted);flex:0 0 auto;
    font-family:system-ui,sans-serif}
  .status .dots{letter-spacing:1px}

  .brand{display:flex;align-items:center;gap:9px;padding:4px 18px 8px;flex:0 0 auto}
  .brand svg{width:30px;height:30px;flex:0 0 auto}
  .brand .bt{line-height:1}
  .brand .n1{font-size:15px;letter-spacing:3px;color:var(--gold2);font-weight:700}
  .brand .n2{font-size:15px;letter-spacing:3px;color:var(--parch);font-weight:700}
  .brand .bs{font-size:9px;letter-spacing:2px;color:var(--goldsoft);
    text-transform:uppercase;margin-top:2px;font-family:system-ui,sans-serif}

  .head{padding:6px 18px 4px;flex:0 0 auto;display:flex;
    justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line)}
  .head .ht{font-size:19px;color:var(--parch);letter-spacing:.5px}
  .head .hsub{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif;margin-top:1px}
  .head .hpos{font-size:12px;color:var(--gold);font-family:system-ui,sans-serif}

  .screen{flex:1 1 auto;overflow-y:auto;padding:12px 16px 8px;
    display:flex;flex-direction:column}

  /* карта-гримуар */
  .card{position:relative;flex:0 0 auto;border-radius:14px;
    background:
      radial-gradient(90% 60% at 50% 12%, rgba(230,199,119,.10), transparent 60%),
      linear-gradient(180deg,#5f1a1f 0%,#401114 100%);
    border:1px solid var(--wineln);padding:26px 20px 24px;text-align:center;
    cursor:pointer;user-select:none;min-height:230px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(201,162,75,.35),
      inset 0 0 46px rgba(0,0,0,.5),0 6px 24px rgba(0,0,0,.5)}
  .card .em{width:26px;height:26px;opacity:.85;margin-bottom:6px}
  .card .word{font-size:34px;font-weight:700;color:var(--gold2);line-height:1.1;
    text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .card .rule{width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:13px 0}
  .card .tr{font-size:19px;color:#e9d6a3;font-style:italic}
  .card .bk{font-size:22px;color:var(--parch);margin-top:5px}
  .card .hint{font-size:11px;color:#d8b98e;opacity:.75;margin-top:16px;
    font-family:system-ui,sans-serif}

  .row{display:flex;gap:11px;margin-top:14px;flex:0 0 auto}
  .btn{flex:1;font-family:system-ui,sans-serif;font-size:14px;padding:13px;
    border-radius:11px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel);color:var(--parch);transition:.15s}
  .btn:hover{border-color:var(--gold)}
  .know{background:var(--greenbg);border-color:#2f5c41;color:#8fe0ac}
  .know:hover{box-shadow:0 0 12px rgba(79,157,107,.35)}
  .dont{background:var(--redbg);border-color:#5a2b28;color:#e2a19c}
  .dont:hover{box-shadow:0 0 12px rgba(163,74,69,.35)}

  /* викторина */
  .q{font-size:13px;color:var(--muted);font-family:system-ui,sans-serif;margin:2px 0 4px}
  .qword{font-size:26px;color:var(--gold2);text-align:center;margin:6px 0 14px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    margin:7px 0;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--parch);cursor:pointer;font-size:16px;
    font-family:system-ui,sans-serif}
  .opt:hover{border-color:var(--gold)}
  .opt .lt{width:24px;height:24px;flex:0 0 auto;border-radius:6px;border:1px solid var(--goldsoft);
    color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px}
  .opt.correct{background:var(--greenbg);border-color:var(--green)}
  .opt.correct .lt{background:var(--green);color:#0c0a09;border-color:var(--green)}
  .opt.wrong{background:var(--redbg);border-color:var(--red)}
  .opt.wrong .lt{background:var(--red);color:#0c0a09;border-color:var(--red)}

  /* печать */
  input[type=text]{width:100%;padding:14px;font-size:17px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel);color:var(--parch);
    margin-top:12px;font-family:system-ui,sans-serif}
  input[type=text]:focus{outline:none;border-color:var(--gold);
    box-shadow:0 0 12px rgba(201,162,75,.3)}
  .tip{margin-top:12px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);font-size:12px;font-family:system-ui,sans-serif;line-height:1.5}
  .tip b{color:var(--gold)}
  .msg{text-align:center;margin-top:12px;font-size:15px;min-height:22px;font-family:system-ui,sans-serif}
  .primary{width:100%;margin-top:12px;padding:14px;border-radius:11px;cursor:pointer;
    font-family:system-ui,sans-serif;font-size:15px;color:var(--gold2);
    background:linear-gradient(180deg,#2a2119,#1d1712);border:1px solid var(--goldsoft)}
  .primary:hover{box-shadow:0 0 14px rgba(201,162,75,.3)}

  /* управление */
  .sect{font-size:12px;color:var(--goldsoft);text-transform:uppercase;letter-spacing:1.5px;
    font-family:system-ui,sans-serif;margin:16px 0 8px}
  .seg{display:flex;gap:10px}
  .seg button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;font-family:system-ui,sans-serif;font-size:14px}
  .seg button.on{background:linear-gradient(180deg,#3a2c1c,#2a2015);
    border-color:var(--gold);color:var(--gold2)}
  .stats{display:flex;gap:10px;margin-top:2px}
  .chip{flex:1;padding:12px;border-radius:11px;text-align:center;font-family:system-ui,sans-serif}
  .chip .cv{font-size:24px;font-weight:700}.chip .cl{font-size:11px;opacity:.85}
  .chip.g{background:var(--greenbg);border:1px solid #2f5c41;color:#8fe0ac}
  .chip.r{background:var(--redbg);border:1px solid #5a2b28;color:#e2a19c}
  .gauge{display:flex;flex-direction:column;align-items:center;margin-top:16px}
  .gauge svg{width:130px;height:130px}
  .gauge .gt{margin-top:-92px;text-align:center}
  .gauge .gn{font-size:30px;color:var(--gold2);font-weight:700}
  .gauge .gl{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif}
  .gauge .gp{margin-top:52px;font-size:12px;color:var(--gold);font-family:system-ui,sans-serif}

  /* библиотека */
  .impd{border-radius:14px;padding:18px;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,#241d16,#1a1510);border:1px dashed var(--goldsoft)}
  .impd .ii{font-size:26px}.impd .il{font-size:15px;color:var(--gold2);margin-top:6px}
  .impd .is{font-size:11px;color:var(--muted);font-family:system-ui,sans-serif;margin-top:3px}
  .note{margin-top:12px;font-size:11px;color:var(--muted);font-family:system-ui,sans-serif;
    text-align:center;line-height:1.5}
  .lib .li{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .lib .lf{width:22px;text-align:center;color:var(--goldsoft)}
  .lib .ln{font-size:13px;color:var(--parch)}
  .lib .ld{font-size:10px;color:var(--muted);font-family:system-ui,sans-serif}
  .file input{display:none}

  .done{text-align:center;font-size:18px;padding:34px 12px;color:var(--gold2);line-height:1.6}

  /* нижние вкладки */
  .tabs{display:flex;flex:0 0 auto;border-top:1px solid var(--line);
    background:linear-gradient(180deg,#100c0a,#0a0806);padding:6px 4px 8px}
  .tab{flex:1;background:none;border:none;cursor:pointer;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;
    font-family:system-ui,sans-serif;font-size:9.5px;letter-spacing:.3px}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
  .tab.on{color:var(--gold2)}
  .tab.on svg{filter:drop-shadow(0 0 5px rgba(201,162,75,.6))}
</style>
<div class="phone">
  <div class="status"><span>9:41</span><span class="dots">✦ ◗ ▮</span></div>

  <div class="brand">
    <svg viewBox="0 0 40 40"><g fill="none" stroke="#c9a24b" stroke-width="1.4">
      <circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="12.5" stroke="#a98b3f"/>
      </g><path d="M20 6 L23 20 L20 34 L17 20 Z" fill="#e6c777"/>

      <div class="bs">учи · помни · говори</div></div>
  </div>

  <div class="head"><div><div class="ht" id="htitle">Карточки</div>
    <div class="hsub" id="hsub">Запоминай с умом</div></div>
    <div class="hpos" id="hpos"></div></div>

  <div class="screen" id="screen"></div>

  <nav class="tabs">
    <button class="tab on" id="tFlip" onclick="setTab('flip')">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="13" height="14" rx="2"/><path d="M8 4h10a2 2 0 0 1 2 2v11"/></svg>Карточки</button>
    <button class="tab" id="tQuiz" onclick="setTab('quiz')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>Викторина</button>
    <button class="tab" id="tType" onclick="setTab('type')">
      <svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg>Печать</button>
    <button class="tab" id="tSet" onclick="setTab('settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Управление</button>
    <button class="tab" id="tLib" onclick="setTab('library')">
      <svg viewBox="0 0 24 24"><path d="M4 5v14a2 2 0 0 1 2-2h6V4H6a2 2 0 0 0-2 1z"/><path d="M20 5v14a2 2 0 0 0-2-2h-6V4h6a2 2 0 0 1 2 1z"/></svg>Библиотека</button>
  </nav>
</div>

let cards=DEFAULT.map(c=>({en:c[0],tr:c[1],ru:c[2],known:false}));
let order=[],idx=0,tab='flip',flipped=false,dir='en';
const META={
  flip:['Карточки','Запоминай с умом'], quiz:['Викторина','Проверь себя'],
  type:['Печать','Режим сильной памяти'], settings:['Управление','Полный контроль'],
  library:['Библиотека','Импортируй и учи своё']};

function reindex(){order=cards.map((_,i)=>i)}
function shuffleCards(){for(let i=order.length-1;i>0;i--){const j=(i*2654435761>>>0)%(i+1);[order[i],order[j]]=[order[j],order[i]]}idx=0;render()}
function restart(){cards.forEach(c=>c.known=false);reindex();idx=0;render()}
function setTab(t){tab=t;['flip','quiz','type','settings','library'].forEach(x=>{
  const id='t'+({flip:'Flip',quiz:'Quiz',type:'Type',settings:'Set',library:'Lib'})[x];
  document.getElementById(id).classList.toggle('on',x===t)});
  if(t==='flip'||t==='quiz'||t==='type')idx=Math.min(idx,order.length);render()}
function setDir(d){dir=d;idx=0;render()}

function frontText(c){return dir==='en'?c.en:c.ru}
function backTr(c){return c.tr}
function backText(c){return dir==='en'?c.ru:c.en}
function fullBack(c){return dir==='en'?(c.tr+'  '+c.ru):(c.en+'  '+c.tr)}

function head(){
  document.getElementById('htitle').textContent=META[tab][0];
  document.getElementById('hsub').textContent=META[tab][1];
  const p=document.getElementById('hpos');
  p.textContent=(tab==='flip'||tab==='quiz'||tab==='type')?
    Math.min(idx+1,order.length)+' / '+order.length:'';
}

function render(){
  head();
  const s=document.getElementById('screen');
  if(tab==='settings')return renderSettings(s);
  if(tab==='library')return renderLibrary(s);
  if(idx>=order.length){s.innerHTML='<div class="done">✦<br>Свиток пройден до конца.<br>Все слова прошли через тебя.</div><div class="row"><button class="btn dont" onclick="restart()">↻ Сначала</button><button class="btn" onclick="shuffleCards()">🔀 Перемешать</button></div>';return}
  const c=cards[order[idx]];
  if(tab==='flip'){flipped=false;
    s.innerHTML=`<div class="card" onclick="flip()">${EMBLEM}
      <div class="word">${frontText(c)}</div>
      <div id="rev" style="display:none"><div class="rule"></div>
        <div class="tr">${backTr(c)}</div><div class="bk">${backText(c)}</div></div>
      <div class="hint" id="hint">нажмите на карточку, чтобы перевернуть</div></div>
      <div class="row"><button class="btn dont" onclick="mark(false)">↻ Повторить</button>
      <button class="btn know" onclick="mark(true)">✓ Знаю</button></div>`;
  } else if(tab==='quiz'){
    const correct=backText(c);
    const pool=cards.filter(x=>x!==c);const opts=[correct];
    for(let n=0;n<60&&opts.length<4;n++){const r=pool[(idx*7+n*13)%pool.length];const t=backText(r);if(!opts.includes(t))opts.push(t)}
    for(let i=opts.length-1;i>0;i--){const j=(i*2654435761>>>0)%(i+1);[opts[i],opts[j]]=[opts[j],opts[i]]}
    const L=['A','B','C','D'];
    s.innerHTML=`<div class="q">Выберите перевод слова:</div>
      <div class="qword">${frontText(c)}</div>
      ${opts.map((o,i)=>`<button class="opt" onclick="answer(this,${o===correct})"><span class="lt">${L[i]}</span>${o}</button>`).join('')}
      <div class="msg" id="msg"></div>`;
  } else {
    const ans=backText(c);
    s.innerHTML=`<div class="q">Напечатайте перевод:</div>
      <div class="qword">${frontText(c)}</div>
      ${dir==='en'?`<div style="text-align:center;color:#e9d6a3;font-style:italic;margin-top:-6px">${c.tr}</div>`:''}
      <input id="inp" type="text" placeholder="${dir==='en'?'введите перевод на русском':'type the English word'}" autocomplete="off" autocapitalize="off" autocorrect="off">
      <button class="primary" onclick="checkType()">Проверить</button>
      <div class="msg" id="msg"></div>
      <div class="tip">Режим печати — самый эффективный способ запоминания. Мозг работает <b>активно</b>, память становится сильнее.</div>`;
    const inp=document.getElementById('inp');inp.focus();
    window._ans=ans;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkType()});
  }
}
function flip(){const r=document.getElementById('rev'),h=document.getElementById('hint');
  if(r){flipped=!flipped;r.style.display=flipped?'block':'none';if(h)h.style.display=flipped?'none':'block';}}
function mark(k){cards[order[idx]].known=k;if(!k)order.push(order[idx]);idx++;render()}
function answer(btn,ok){document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');cards[order[idx]].known=ok;
  document.getElementById('msg').textContent=ok?'✓ Верно!':'✕ Правильно: '+fullBack(cards[order[idx]]);
  if(!ok)order.push(order[idx]);setTimeout(()=>{idx++;render()},ok?650:1500);}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')}
function checkType(){const inp=document.getElementById('inp');if(inp.disabled)return;
  const val=norm(inp.value);const ans=window._ans;
  const variants=ans.split(/[\/,()]/).map(norm).filter(Boolean);
  const ok=variants.some(v=>v===val);cards[order[idx]].known=ok;if(!ok)order.push(order[idx]);
  document.getElementById('msg').textContent=ok?'✓ Верно!':'✕ Правильно: '+ans;
  inp.disabled=true;setTimeout(()=>{idx++;render()},ok?650:1700);}

function renderSettings(s){
  const total=cards.length,known=cards.filter(c=>c.known).length,rev=total-known;
  const p=total?known/total:0,C=2*Math.PI*54,off=C*(1-p);
  s.innerHTML=`
    <div class="sect">Направление</div>
    <div class="seg"><button class="${dir==='en'?'on':''}" onclick="setDir('en')">EN → RU</button>
      <button class="${dir==='ru'?'on':''}" onclick="setDir('ru')">RU → EN</button></div>
    <div class="sect">Порядок</div>
    <div class="seg"><button onclick="shuffleCards()">🔀 Перемешать</button>
      <button onclick="restart()">↻ Сначала</button></div>
    <div class="sect">Статистика</div>
    <div class="stats"><div class="chip g"><div class="cv">${known}</div><div class="cl">Знаю</div></div>
      <div class="chip r"><div class="cv">${rev}</div><div class="cl">Повторить</div></div></div>
    <div class="gauge">
      <svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="#2a221b" stroke-width="9"/>
      <circle cx="65" cy="65" r="54" fill="none" stroke="#c9a24b" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 65 65)"/></svg>
      <div class="gt"><div class="gn">${total}</div><div class="gl">всего карточек</div></div>
      <div class="gp">Прогресс: ${Math.round(p*100)}%</div></div>`;
}
function renderLibrary(s){
  const files=[
    ['📄','README.md','старт · метод · ожидания'],
    ['🗺️','план/00_план_4_месяца.md','дорожная карта A1→B1'],
    ['📘','lessons/','уроки с мнемоникой'],
    ['🔤','словарь/глаголы_топ.md','глаголы · 3 формы'],
    ['📚','словарь/словарь_по_темам.md','весь словарь по темам'],
    ['🗂️','словарь/карточки.csv','база карточек'],
    ['✈️','путешествия/фразы.md','кафе · аэропорт · о себе'],
    ['🦅','гражданство/гражданство_сша.md','100 civics-вопросов USCIS'],
    ['📱','приложение/тренажёр.html','это приложение']];
  s.innerHTML=`
    <label class="impd file"><div class="ii">📂</div><div class="il">Свой CSV</div>
      <div class="is">импортируй свои карточки из CSV-файла</div>
      <input type="file" accept=".csv" onchange="loadCsv(event)"></label>
    <div class="note">«Не знаю» карточки автоматически возвращаются в конец колоды.</div>
    <div class="sect">Моя библиотека курса</div>
    <div class="lib">${files.map(f=>`<div class="li"><div class="lf">${f[0]}</div>
      <div><div class="ln">${f[1]}</div><div class="ld">${f[2]}</div></div></div>`).join('')}</div>`;
}
function loadCsv(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const rows=rd.result.split(/\r?\n/).filter(r=>r.trim());const parsed=[];
    for(let i=0;i<rows.length;i++){if(rows[i].trim().startsWith('#'))continue;
      const p=rows[i].split(',');if(p.length<3)continue;
      if(i===0&&/english|русск|engli/i.test(rows[i]))continue;
      parsed.push({en:p[0].trim(),tr:p[1].trim(),ru:p.slice(2).join(',').trim(),known:false});}
    if(parsed.length){cards=parsed;reindex();idx=0;tab='flip';setTab('flip');}
    else alert('Не нашёл карточки. Формат: English,Transcription,Русский');};
  rd.readAsText(f,'utf-8');}
reindex();render();
</script>
