<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>✦ Grimoire · Английский Марины ✦</title>
<style>
  :root{
    --gold:#e8bd6d; --gold2:#f4d99b; --violet:#b06bff; --violet2:#c99bff;
    --emerald:#5fe0a0; --blood:#e0574f; --parch:#efe4cf; --muted:#a99bbf;
    --ink:#0a0611; --stone:#191029; --stone2:#241634; --line:#4a2f6e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--parch);
    background:
      radial-gradient(120% 80% at 50% -10%, #2a123f 0%, #140a22 45%, #07040d 100%),
      #07040d;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  /* плавающие магические искры */
  .spark{position:fixed;bottom:-20px;width:4px;height:4px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 8px 2px var(--gold);opacity:0;
    animation:rise linear infinite;pointer-events:none;z-index:0}
  @keyframes rise{
    0%{transform:translateY(0) scale(.6);opacity:0}
    15%{opacity:.9}
    100%{transform:translateY(-105vh) scale(1.1);opacity:0}}

  /* рамка 9:16 — гримуар */
  .frame{
    position:relative;z-index:1;
    width:min(100vw, calc(100vh * 9 / 16));
    height:min(100vh, calc(100vw * 16 / 9));
    background:
      radial-gradient(140% 60% at 50% 0%, rgba(176,107,255,.18), transparent 60%),
      linear-gradient(180deg,#1a1029 0%, #120a1f 100%);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 0 0 1px rgba(232,189,109,.25), 0 0 60px rgba(176,107,255,.25),
      inset 0 0 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;overflow:hidden;padding:16px 15px;
  }
  .frame::before{content:"";position:absolute;inset:7px;border-radius:16px;
    border:1px solid rgba(232,189,109,.18);pointer-events:none}

  header{text-align:center;flex:0 0 auto}
  .rune{color:var(--gold);letter-spacing:6px;font-size:15px;opacity:.85}
  h1{font-size:20px;margin:2px 0 0;letter-spacing:1px;
    background:linear-gradient(180deg,var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 18px rgba(232,189,109,.35)}
  .sub{color:var(--muted);font-size:11px;margin-top:2px;font-style:italic}

  .bar{display:flex;gap:6px;justify-content:center;margin-top:12px;flex:0 0 auto}
  .bar.small{margin-top:7px}
  button,select,label.file{
    font-family:inherit;background:linear-gradient(180deg,var(--stone2),var(--stone));
    color:var(--parch);border:1px solid var(--line);border-radius:11px;
    padding:9px 11px;font-size:13px;cursor:pointer;transition:.18s;flex:1;min-width:0}
  .bar.small button,.bar.small label{font-size:12px;padding:8px 8px}
  button:hover,label.file:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(232,189,109,.25)}
  button.active{background:linear-gradient(180deg,#4a2b7a,#33205a);
    border-color:var(--violet);color:#fff;box-shadow:0 0 16px rgba(176,107,255,.45)}

  .progress{text-align:center;font-size:11px;color:var(--muted);margin-top:11px;flex:0 0 auto;
    font-variant:small-caps;letter-spacing:.5px}
  .progress b{color:var(--gold2)}
  .divider{flex:0 0 auto;text-align:center;color:var(--line);font-size:12px;margin:9px 0 2px}

  #stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    overflow-y:auto;padding:4px 2px}

  .card{position:relative;
    background:
      radial-gradient(90% 70% at 50% 25%, rgba(176,107,255,.14), transparent 70%),
      linear-gradient(180deg,#241635,#1a0f2a);
    border:1px solid var(--line);border-radius:18px;
    min-height:200px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px 18px;cursor:pointer;
    user-select:none;box-shadow:inset 0 0 40px rgba(0,0,0,.5),0 0 24px rgba(176,107,255,.15)}
  .card::before{content:"✦";position:absolute;top:9px;left:13px;color:var(--gold);opacity:.4;font-size:13px}
  .card::after{content:"✦";position:absolute;bottom:9px;right:13px;color:var(--gold);opacity:.4;font-size:13px}
  .front{font-size:34px;font-weight:700;line-height:1.15;
    color:var(--gold2);text-shadow:0 0 22px rgba(232,189,109,.4)}
  .tr{color:var(--violet2);font-size:20px;margin-top:12px;font-style:italic}
  .back{font-size:26px;font-weight:600;margin-top:6px;color:var(--parch)}
  .hint{color:var(--muted);font-size:11px;margin-top:16px;font-style:italic;letter-spacing:.5px}

  .row{display:flex;gap:10px;margin-top:14px;flex:0 0 auto}
  .row button{flex:1;font-size:14px;padding:13px}
  .know{border-color:var(--emerald);color:var(--emerald)}
  .know:hover{background:rgba(95,224,160,.14);box-shadow:0 0 14px rgba(95,224,160,.3)}
  .dont{border-color:var(--blood);color:#f0a19b}
  .dont:hover{background:rgba(224,87,79,.14);box-shadow:0 0 14px rgba(224,87,79,.3)}

  .opts{margin-top:12px}
  .opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px 14px;font-size:16px}
  .opt.correct{background:rgba(95,224,160,.18);border-color:var(--emerald)}
  .opt.wrong{background:rgba(224,87,79,.18);border-color:var(--blood)}
  input[type=text]{width:100%;padding:13px;font-size:17px;border-radius:11px;
    border:1px solid var(--line);background:var(--stone);color:var(--parch);
    margin-top:14px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 14px rgba(232,189,109,.3)}
  .msg{text-align:center;margin-top:12px;font-size:15px;min-height:22px}
  .done{text-align:center;font-size:19px;padding:30px 10px;color:var(--gold2);line-height:1.5}
  .file input{display:none}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="rune">☾ ⚝ ☽</div>
    <h1>Grimoire of English</h1>
    <div class="sub">заклинания слов · без интернета</div>
  </header>

  <div class="bar">
    <button id="mFlip" class="active" onclick="setMode('flip')">🃏 Руны</button>
    <button id="mQuiz" onclick="setMode('quiz')">📜 Ритуал</button>
    <button id="mType" onclick="setMode('type')">⌨ Заклинание</button>
  </div>
  <div class="bar small">
    <button id="dir" onclick="toggleDir()">EN → RU</button>
    <button onclick="shuffleCards()">🔀 Перемешать</button>
    <button onclick="restart()">↻ Заново</button>
    <label class="file">📂 CSV<input type="file" accept=".csv" onchange="loadCsv(event)"></label>
  </div>

  <div class="progress">свиток <b><span id="pos">0</span></b> / <b><span id="total">0</span></b>
    · познано <b id="known">0</b> · во тьме <b id="review">0</b></div>
  <div class="divider">━━━ ✦ ━━━</div>

  <div id="stage"></div>
</div>

// магические искры
(function(){const n=14;for(let i=0;i<n;i++){const s=document.createElement('div');

  s.style.animationDuration=(7+(i%5)*2)+'s';s.style.animationDelay=(-i*0.9)+'s';
  s.style.background=i%3?'#e8bd6d':'#b06bff';
  s.style.boxShadow='0 0 8px 2px '+(i%3?'#e8bd6d':'#b06bff');
  document.body.appendChild(s);}})();

let cards = DEFAULT.map(c=>({en:c[0],tr:c[1],ru:c[2],known:false}));
let order=[], idx=0, mode='flip', flipped=false, dir='en';

function reindex(){order=cards.map((_,i)=>i)}
function shuffleCards(){for(let i=order.length-1;i>0;i--){const j=(i*2654435761>>>0)%(i+1);[order[i],order[j]]=[order[j],order[i]]}idx=0;render()}
function restart(){cards.forEach(c=>c.known=false);reindex();idx=0;render()}
function setMode(m){mode=m;['flip','quiz','type'].forEach(x=>document.getElementById('m'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===m));idx=0;render()}
function toggleDir(){dir=dir==='en'?'ru':'en';document.getElementById('dir').textContent=dir==='en'?'EN → RU':'RU → EN';idx=0;render()}

function stats(){
  document.getElementById('total').textContent=order.length;
  document.getElementById('pos').textContent=Math.min(idx+1,order.length);
  const k=cards.filter(c=>c.known).length;
  document.getElementById('known').textContent=k;
  document.getElementById('review').textContent=cards.length-k;
}
function frontText(c){return dir==='en'?c.en:c.ru}
function backText(c){return dir==='en'?(c.tr+'  '+c.ru):(c.en+'  '+c.tr)}

function render(){
  stats();
  const stage=document.getElementById('stage');
  if(idx>=order.length){stage.innerHTML='<div class="done">✦ ✦ ✦<br>Гримуар прочитан до конца.<br>Все слова прошли через тебя.<br><br>Нажми «↻ Заново» или «🔀 Перемешать».</div>';return}
  const c=cards[order[idx]];
  if(mode==='flip'){flipped=false;
    stage.innerHTML=`<div class="card" onclick="flip()">
      <div class="front">${frontText(c)}</div>
      <div id="rev" style="display:none">${dir==='en'?`<div class="tr">${c.tr}</div><div class="back">${c.ru}</div>`:`<div class="back">${c.en}</div><div class="tr">${c.tr}</div>`}</div>
      <div class="hint">▾ коснись, чтобы открыть тайну ▾</div></div>
      <div class="row"><button class="dont" onclick="mark(false)">🌑 Во тьму</button>
      <button class="know" onclick="mark(true)">✨ Познано</button></div>`;
  } else if(mode==='quiz'){
    const correct=backText(c);
    const pool=cards.filter(x=>x!==c);
    const opts=[correct];
    for(let n=0;n<40&&opts.length<4;n++){const r=pool[(idx*7+n*13)%pool.length];const t=backText(r);if(!opts.includes(t))opts.push(t)}
    for(let i=opts.length-1;i>0;i--){const j=(i*2654435761>>>0)%(i+1);[opts[i],opts[j]]=[opts[j],opts[i]]}
    stage.innerHTML=`<div class="card"><div class="front">${frontText(c)}</div></div>
      <div class="opts">${opts.map(o=>`<button class="opt" onclick="answer(this,${o===correct})">${o}</button>`).join('')}</div>
      <div class="msg" id="msg"></div>`;
  } else {
    const answer=(dir==='en'?c.ru:c.en);
    stage.innerHTML=`<div class="card"><div class="front">${frontText(c)}</div>
      ${dir==='en'?'':`<div class="tr">${c.tr}</div>`}</div>
      <input id="inp" type="text" placeholder="произнеси заклинание (перевод) + Enter" autocomplete="off" autocapitalize="off" autocorrect="off">
      <div class="msg" id="msg"></div>`;
    const inp=document.getElementById('inp');inp.focus();
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkType(answer)});
  }
}
function flip(){const r=document.getElementById('rev');if(r)r.style.display=flipped?'none':'block';flipped=!flipped}
function mark(k){cards[order[idx]].known=k;if(!k)order.push(order[idx]);idx++;render()}
function answer(btn,ok){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=null);
  btn.classList.add(ok?'correct':'wrong');
  cards[order[idx]].known=ok;
  document.getElementById('msg').textContent=ok?'✨ Верно!':'🌑 Правильно: '+backText(cards[order[idx]]);
  if(!ok)order.push(order[idx]);
  setTimeout(()=>{idx++;render()},ok?700:1600);
}
function norm(s){return s.trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')}
function checkType(ans){
  const inp=document.getElementById('inp');const val=norm(inp.value);
  const variants=ans.split(/[\/,()]/).map(norm).filter(Boolean);
  const ok=variants.some(v=>v===val);
  cards[order[idx]].known=ok;if(!ok)order.push(order[idx]);
  document.getElementById('msg').textContent=ok?'✨ Верно!':'🌑 Правильно: '+ans;
  inp.disabled=true;setTimeout(()=>{idx++;render()},ok?700:1800);
}
function loadCsv(e){
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{
    const rows=rd.result.split(/\r?\n/).filter(r=>r.trim());
    const parsed=[];
    for(let i=0;i<rows.length;i++){
      const p=rows[i].split(',');if(p.length<3)continue;
      if(i===0&&/english|русск|engli/i.test(rows[i]))continue;
      parsed.push({en:p[0].trim(),tr:p[1].trim(),ru:p.slice(2).join(',').trim(),known:false});
    }
    if(parsed.length){cards=parsed;reindex();idx=0;render();}
    else alert('Не нашёл карточки. Нужен формат: English,Transcription,Русский');
  };
  rd.readAsText(f,'utf-8');
}
reindex();render();
